# Domain override for the 2020 All England broadcast camera in material/.
# The standard full-court view scores around 0.40-0.52 because its detected
# court geometry differs from the production reference. A longer merge gap
# prevents those low-scoring samples from fragmenting one rally into many
# tiny Main View intervals. This is a complete production-derived profile
# because configuration files merge with default.yaml, not with one another.
main_view:
  sample_every: 15
  threshold: 0.40
  min_segment_seconds: 1.5
  max_gap_seconds: 3.0

rally_segmentation:
  sample_every: 10
  min_rally_seconds: 2.0
  max_rally_seconds: 90.0
  max_gap_seconds: 2.0
  pre_context_seconds: 2.2
  post_context_seconds: 1.4
  min_active_samples: 2
  min_motion_score: 0.008

court_calibration:
  reference_points: null
  detector: hybrid
  min_line_support: 0.45
  min_area_ratio: 0.08
  stability_corner_rmse_ratio: 0.05
  min_stable_candidates: 2

player_tracking:
  detector: rtmpose
  roles: [near, far]
  pose_keypoint_confidence: 0.35
  pose_min_keypoints: 5
  rtmpose_mode: balanced
  rtmpose_backend: onnxruntime
  rtmpose_device: cuda

shuttle_tracking:
  model: tracknet
  tracknet_weights: weights/TrackNet_best.pt
  tracknet_device: cuda
  tracknet_vis_threshold: 0.15
  max_missing_frames: 0

smoothing:
  shuttle_max_interpolation_displacement_px: 80.0

demo_rendering:
  enabled: true
  output_filename: badminton_full_analysis.mp4
  max_rallies: null
  show_topdown: true
  show_stats: true
  browser_compatible: true
