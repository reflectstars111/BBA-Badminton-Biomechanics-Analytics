data:
  raw_videos_dir: raw_videos
  rallies_dir: rallies
  metadata_dir: metadata
  annotations_dir: annotations
  outputs_dir: outputs
  runs_dir: runs

rally_segmentation:
  sample_every: 15
  min_rally_seconds: 1.0
  max_rally_seconds: 120.0
  max_gap_seconds: 3.0
  pre_context_seconds: 2.2
  post_context_seconds: 1.4
  min_active_samples: 2
  min_motion_score: 0.01
  max_motion_score: 0.16
  min_center_green_ratio: 0.22
  min_bottom_green_ratio: 0.36
  min_line_ratio: 0.09
  min_top_green_ratio: 0.05
  min_middle_green_ratio: 0.20
  max_left_right_green_diff: 0.16
  min_top_dark_ratio: 0.15
  min_middle_edge_ratio: 0.16

main_view:
  sample_every: 30
  threshold: 0.75
  min_segment_seconds: 3.0
  max_gap_seconds: 2.0

court_calibration:
  reference_points: null
  detector: contour
  min_line_support: 0.15
  min_area_ratio: 0.08
  max_condition_number: 10000000000.0
  max_reprojection_error_px: 1.0
  stability_corner_rmse_ratio: 0.04
  min_stable_candidates: 2

player_tracking:
  detector: yolo
  roles:
    - near
    - far
  yolo_model: yolov8n.pt
  yolo_confidence: 0.25
  yolo_image_size: 640
  pose_model: yolo11n-pose.pt
  pose_keypoint_confidence: 0.35
  pose_min_keypoints: 5
  rtmpose_mode: balanced
  rtmpose_backend: onnxruntime
  rtmpose_device: auto
  rtmpose_detector_model: ""
  rtmpose_pose_model: ""
  rtmpose_detector_input_size: [416, 416]
  rtmpose_pose_input_size: [192, 256]
  near_max_track_distance: 120.0
  far_max_track_distance: 170.0
  near_max_missing_frames: 4
  far_max_missing_frames: 10
  role_half_tolerance: 48.0

shuttle_tracking:
  model: motion_bright_baseline
  tracknet_weights: weights/TrackNet_best.pt
  tracknet_device: auto
  tracknet_vis_threshold: 0.15
  diff_threshold: 18
  max_jump: 80.0
  max_missing_frames: 3
  min_brightness: 165
  min_candidate_area: 1.0
  max_candidate_area: 55.0
  max_candidate_size: 14
  direction_weight: 24.0
  speed_weight: 0.35

smoothing:
  min_confidence: 0.2
  max_gap_frames: 4
  shuttle_max_interpolation_displacement_px: 80.0
  window_size: 5
  ema_alpha: 0.35

tactical_analysis:
  hit_distance_px: 80.0
  turn_angle_deg: 100.0
  min_event_gap_frames: 15

demo_rendering:
  enabled: true
  output_filename: badminton_analysis_demo.mp4
  max_rallies: null
  trail_length: 18
  event_hold_frames: 15
  show_topdown: true
  show_stats: true
  codec: mp4v
  browser_compatible: true
  preserve_audio: false
