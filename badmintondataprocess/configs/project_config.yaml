# Minimal supported override example. Values not consumed by the research
# pipeline are intentionally absent and rejected by the strict schema.
data:
  runs_dir: runs

rally_segmentation:
  min_rally_seconds: 3.0
  max_gap_seconds: 8.0
  pre_context_seconds: 2.2
  post_context_seconds: 1.4
  min_active_samples: 2

player_tracking:
  detector: yolo
  roles:
    - near
    - far

shuttle_tracking:
  model: tracknet
  tracknet_weights: weights/TrackNet_best.pt
