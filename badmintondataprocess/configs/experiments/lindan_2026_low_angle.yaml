# End-to-end GPU profile for a fixed, low-angle full-court camera. The
# processing stages are identical to production; only the Main View gate is
# adapted to the court occupying less vertical image area under strong
# perspective.
main_view:
  sample_every: 15
  threshold: 0.28
  max_reject_score: 0.65
  min_segment_seconds: 1.5
  max_gap_seconds: 3.0

rally_segmentation:
  sample_every: 10
  min_rally_seconds: 2.0
  max_rally_seconds: 90.0
  # Player motion persists between points in this fixed view. A shorter gap
  # prevents multiple rallies from being merged into one long clip.
  max_gap_seconds: 0.75
  pre_context_seconds: 2.2
  post_context_seconds: 1.4
  min_active_samples: 2
  min_motion_score: 0.008
  # In a low camera view the court is intentionally concentrated in the
  # lower image band; line and motion evidence remain required.
  min_center_green_ratio: 0.18
  min_bottom_green_ratio: 0.25
  min_top_green_ratio: 0.0
  min_middle_green_ratio: 0.0
  min_top_dark_ratio: 0.0

court_calibration:
  # Fixed camera fit from six timestamps. The near-right outer corner is
  # outside the image under this side-on perspective, so one of four manual
  # corners is explicitly allowed off-frame.
  reference_points:
    - 0.073934
    - 0.807226
    - 0.501256
    - 0.760871
    - 1.468267
    - 0.787596
    - 0.375738
    - 0.974972
  detector: hybrid
  min_line_support: 0.45
  min_area_ratio: 0.08
  max_out_of_bounds_ratio: 0.25
  stability_corner_rmse_ratio: 0.05
  min_stable_candidates: 2

player_tracking:
  detector: rtmpose
  roles: [near, far]
  # Far ankles sit about 15 px beyond the fitted baseline under net
  # occlusion. Admit a 2.5% margin, then clamp them to the court boundary.
  court_mask_margin_ratio: 0.025
  pose_keypoint_confidence: 0.35
  pose_min_keypoints: 5
  rtmpose_mode: balanced
  rtmpose_backend: onnxruntime
  rtmpose_device: cuda

shuttle_tracking:
  model: tracknet
  tracknet_weights: weights/TrackNet_best.pt
  tracknet_device: cuda
  tracknet_vis_threshold: 0.15
  max_missing_frames: 0

smoothing:
  shuttle_max_interpolation_displacement_px: 80.0

demo_rendering:
  enabled: true
  output_filename: badminton_full_analysis.mp4
  max_rallies: null
  show_topdown: true
  show_stats: true
  browser_compatible: true
